name: CI
on:
  push:
    branches: [main, 'setup/**', 'feature/**', 'fix/**']
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    name: Validate Definitions
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - run: python deploy/check_repository.py
      - run: python scripts/check_publication.py
      - run: python scripts/check_documentation.py
      - run: pytest -q
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3
        with:
          terraform_version: '1.16.4'
      - name: Validate Terraform without backend credentials
        shell: bash
        run: |
          set -euo pipefail
          terraform fmt -check -recursive infra
          for root in fabric identity state; do
            terraform -chdir="infra/$root" init -backend=false -lockfile=readonly
            terraform -chdir="infra/$root" validate
          done
