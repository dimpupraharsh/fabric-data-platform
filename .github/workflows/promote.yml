name: Promote Fabric Release
on:
  workflow_dispatch:
    inputs:
      promote_to:
        description: Highest approved environment for this immutable release
        required: true
        default: test
        type: choice
        options: [test, production]
permissions:
  contents: read
concurrency:
  group: fabric-release
  cancel-in-progress: false
jobs:
  candidate:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      digest: ${{ steps.pack.outputs.digest }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: python deploy/check_repository.py && pytest -q
      - name: Fail closed before requesting a Production approval
        if: inputs.promote_to == 'production'
        run: |
          python - <<'PY'
          import json
          config = json.load(open('config/environments.json'))['production']
          assert all(config[key] for key in ('release_enabled', 'sql_migrations_enabled', 'semantic_enabled')), 'Production adoption and integration gates are not yet approved'
          PY
      - name: Package the tested commit once
        id: pack
        shell: bash
        run: |
          set -euo pipefail
          git archive --format=tar HEAD > release.tar
          echo "digest=$(sha256sum release.tar | cut -d ' ' -f 1)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: fabric-release-${{ github.sha }}
          path: release.tar
          if-no-files-found: error
          retention-days: 30
  dev:
    needs: candidate
    uses: ./.github/workflows/release-environment.yml
    with:
      environment: dev
      digest: ${{ needs.candidate.outputs.digest }}
    permissions:
      contents: read
      id-token: write
  test:
    needs: [candidate, dev]
    uses: ./.github/workflows/release-environment.yml
    with:
      environment: test
      digest: ${{ needs.candidate.outputs.digest }}
    permissions:
      contents: read
      id-token: write
  production:
    needs: [candidate, test]
    if: inputs.promote_to == 'production'
    uses: ./.github/workflows/release-environment.yml
    with:
      environment: production
      digest: ${{ needs.candidate.outputs.digest }}
    permissions:
      contents: read
      id-token: write
