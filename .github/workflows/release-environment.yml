name: Release One Environment
on:
  workflow_call:
    inputs:
      environment:
        required: true
        type: string
      digest:
        required: true
        type: string
permissions:
  contents: read
  id-token: write
concurrency:
  group: deploy-${{ inputs.environment }}
  cancel-in-progress: false
jobs:
  release:
    environment: ${{ inputs.environment }}
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: fabric-release-${{ github.sha }}
      - name: Verify immutable release
        env:
          EXPECTED_DIGEST: ${{ inputs.digest }}
        shell: bash
        run: |
          set -euo pipefail
          printf '%s  release.tar\n' "$EXPECTED_DIGEST" | sha256sum -c -
          tar -xf release.tar
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - uses: ./.github/actions/sql-driver
      - uses: azure/login@8216e11d8cd9b42fe925c852af8e76311ff067ac # v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          allow-no-subscriptions: true
      - name: Apply additive SQL migrations
        run: python deploy/migrate.py --environment '${{ inputs.environment }}'
      - name: Publish approved definitions without schedules or deletion
        run: |
          python deploy/release.py --environment '${{ inputs.environment }}' --stage semantic --execute
          python deploy/release.py --environment '${{ inputs.environment }}' --stage application --execute
      - name: Verify deployment and environment isolation
        run: |
          python deploy/verify_bindings.py --environment '${{ inputs.environment }}'
          python deploy/smoke.py --environment '${{ inputs.environment }}' --application
      - name: Test deployed checkpoint and failure contracts without ingesting data
        if: inputs.environment != 'production'
        run: python deploy/test_control_contracts.py --environment '${{ inputs.environment }}'
      - name: Run bounded nonproduction gateway, S3, SQL and Lakehouse probe
        if: inputs.environment != 'production'
        run: python deploy/test_connectivity.py --environment '${{ inputs.environment }}'
      - name: Require failed children to block downstream serving in Test
        if: inputs.environment == 'test'
        run: python deploy/test_failure_paths.py --environment test --execute
      - name: Validate isolated Silver and Gold business contracts in Test
        if: inputs.environment == 'test'
        run: python deploy/test_business_acceptance.py --environment test --execute
      - name: Preserve business acceptance evidence
        if: always() && inputs.environment == 'test'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: business-acceptance-${{ github.sha }}
          path: |
            output/business_acceptance.json
            output/failure_acceptance.json
          if-no-files-found: warn
          retention-days: 30
