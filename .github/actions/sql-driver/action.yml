name: Install Fabric SQL Driver
description: Install the Microsoft ODBC 18 driver from the official Ubuntu repository
runs:
  using: composite
  steps:
    - shell: bash
      run: |
        set -euo pipefail
        curl -fsSLo /tmp/packages-microsoft-prod.deb https://packages.microsoft.com/config/ubuntu/24.04/packages-microsoft-prod.deb
        sudo dpkg -i /tmp/packages-microsoft-prod.deb
        sudo apt-get update -qq
        sudo ACCEPT_EULA=Y apt-get install -y -qq msodbcsql18 unixodbc-dev
